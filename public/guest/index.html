<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sketchy">
<meta name="theme-color" content="#006df6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Sketchy Robotics</title>
<style>
  :root{--blue:#006df6;--ink:#0a0a0a;--mut:#5b6474;--bg:#f3f5f8;--card:#fff;--line:#dde2ea}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  body{height:100dvh}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line)}
  header .logo{height:30px}
  header .ev{margin-left:auto;color:var(--mut);font-size:14px;text-transform:uppercase;letter-spacing:.6px}
  main{flex:1;min-height:0;overflow:auto;padding:22px;display:flex;flex-direction:column}
  main.cam-mode{overflow:hidden;padding:10px 22px}
  #s-cam{height:100%;min-height:0}
  .screen{display:none;flex:1;flex-direction:column;min-height:0}
  .screen.on{display:flex}
  h1{font-size:30px;margin:0 0 6px;letter-spacing:-.3px}
  .sub{color:var(--mut);margin:0 0 20px;font-size:18px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px} /* 4 across in portrait; the page scrolls as the gallery grows */
  @media (orientation:landscape){.tiles{grid-template-columns:repeat(6,1fr)}}
  @media (max-width:600px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:center;transition:transform .08s;display:flex;flex-direction:column}
  .tile:active{border-color:var(--blue)}
  .tile:active{transform:scale(.97)}
  .tile img{width:100%;aspect-ratio:4/5;object-fit:contain;display:block;background:#fff;padding:4px} /* portrait box so upright line art fills the tile */
  .tile .ph{width:100%;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:#e9eef7;color:var(--mut);font-size:48px}
  .tile .nm{padding:12px;font-weight:700;font-size:19px;background:var(--blue);color:#fff;letter-spacing:.3px}
  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:10px 0 26px}
  .choice{background:#fff;border:2px solid var(--line);border-radius:16px;padding:26px 14px;font-size:22px;font-weight:700;text-align:center;cursor:pointer}
  .choice.on{border-color:var(--blue);background:#eaf2ff;color:var(--blue)}
  .choice small{display:block;font-weight:500;font-size:14px;color:var(--mut);margin-top:4px}
  .pair{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
  .pair h3{margin:0 0 10px;font-size:16px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .pair .choices{margin:0}
  .bar{display:flex;gap:12px;margin-top:auto;padding-top:18px}
  .btn{flex:1;border:0;border-radius:14px;padding:18px;font:700 20px system-ui;cursor:pointer;background:#fff;color:var(--ink);border:2px solid var(--line)}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn:disabled{opacity:.4}
  .cam{flex:1;position:relative;background:#000;border-radius:18px;overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center}
  #s-cam .crumb{flex:0 0 auto}#s-cam .bar{flex:0 0 auto;padding-top:12px}
  .cam video,.cam img,.cam canvas{max-width:100%;max-height:100%;object-fit:contain}
  .cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1) scale(var(--zoom,1.6));transform-origin:center}
  .count{position:absolute;top:18px;left:50%;transform:translateX(-50%);min-width:92px;padding:6px 20px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:800 56px/1.1 system-ui;text-align:center;display:none;letter-spacing:1px}
  .count.on{display:block}
  .count.go{background:rgba(0,109,246,.85);font-size:34px;padding:14px 26px}
  .tip{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;font:600 16px system-ui;white-space:nowrap}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.on{animation:fl .35s ease-out}@keyframes fl{0%{opacity:.9}100%{opacity:0}}
  .guide{position:absolute;left:50%;top:48%;height:58%;max-height:520px;aspect-ratio:3/4;transform:translate(-50%,-50%);pointer-events:none;border:3px dashed rgba(255,255,255,.55);border-radius:50%/48%}
  .snap{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:140px;height:140px;border-radius:50%;background:#fff;border:8px solid rgba(255,255,255,.45);box-shadow:0 6px 24px rgba(0,0,0,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .snap span{font:800 16px/1.1 system-ui;color:var(--blue);letter-spacing:.5px}
  .snap:active{transform:translateX(-50%) scale(.95)}
  .snap:disabled{opacity:.5}
  .status{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
  .big{font-size:96px;font-weight:800;color:var(--blue);line-height:1}
  .art{max-height:52vh;max-width:100%;border:1px solid var(--line);border-radius:12px;background:#fff}
  .spin{width:54px;height:54px;border:6px solid #dbe5f5;border-top-color:var(--blue);border-radius:50%;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .err{background:#fde8eb;color:#8f1d2b;border:1px solid #f3b4bd;padding:12px 16px;border-radius:12px}
  .crumb{color:var(--mut);font-size:15px;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="60 150 1870 400" xmlns="http://www.w3.org/2000/svg"><g id="L"></g></svg>
  <span class="ev" id="evName"></span>
</header>
<main>
  <!-- 1 style -->
  <section class="screen on" id="s-theme">
    <h1>Pick your style</h1><p class="sub">Tap a style, snap a selfie, and the robot draws you.</p>
    <div class="tiles" id="tiles"></div>
  </section>
  <!-- 2 who -->
  <section class="screen" id="s-who">
    <div class="crumb" id="crumb1"></div>
    <h1>Who's in the picture?</h1>
    <div class="choices" id="who">
      <div class="choice" data-w="1">One person</div>
      <div class="choice" data-w="2">Two people</div>
      <div class="choice" data-w="pet">Person + pet</div>
    </div>
    <div id="genders"></div>
    <div class="bar"><button class="btn" id="backWho">Back</button><button class="btn primary" id="nextWho" disabled>Next: take photo</button></div>
  </section>
  <!-- 3 camera -->
  <section class="screen" id="s-cam">
    <div class="crumb" id="crumb2"></div>
    <div class="cam" id="cam">
      <video id="video" autoplay playsinline muted></video>
      <div class="guide" id="guide"></div>
      <div class="count" id="count"></div>
      <div class="tip" id="camTip">Get your face in the oval, then tap the button</div>
      <button class="snap" id="shutter"><span>TAKE PHOTO</span></button>
      <img id="shot" style="display:none">
    </div>
    <div class="bar" id="camBar"><button class="btn" id="backCam">Back</button><button class="btn" id="fileBtn">Use a photo instead</button><input type="file" id="fileIn" accept="image/*" capture="user" style="display:none"></div>
    <div class="bar" id="shotBar" style="display:none"><button class="btn" id="retake">Retake</button><button class="btn primary" id="send">Looks good — send it</button></div>
  </section>
  <!-- 4 status -->
  <section class="screen" id="s-status">
    <div class="status" id="status"></div>
    <div class="bar"><button class="btn primary" id="again">Next person</button></div>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const screens = ['s-theme', 's-who', 's-cam', 's-status'];
  const show = id => { for (const s of screens) $(s).classList.toggle('on', s === id); document.querySelector('main').classList.toggle('cam-mode', id === 's-cam'); setTimeout(() => { if (typeof bump === 'function') bump(); }, 0); };
  const S = { themes: [], theme: null, who: null, g: {}, blob: null, job: null, stream: null };
  const LABEL = { male: 'Male', female: 'Female' };

  fetch('logo.svg').then(r => r.text()).then(t => { const m = t.match(/<svg[^>]*>([\s\S]*)<\/svg>/); if (m) document.querySelector('header .logo').innerHTML = m[1]; }).catch(() => {});

  async function loadThemes() {
    const r = await fetch('/api/themes').then(r => r.json());
    S.themes = r.themes; $('evName').textContent = r.event || ''; S.zoom = +r.cameraZoom || 1.6; document.documentElement.style.setProperty('--zoom', S.zoom);
    const box = $('tiles'); box.innerHTML = '';
    if (!r.themes.length) box.innerHTML = '<p class="sub">No styles are set up yet. Add one in Admin.</p>';
    for (const t of r.themes) {
      const d = document.createElement('div'); d.className = 'tile';
      d.innerHTML = (t.hasThumb ? `<img src="/api/themes/${t.slug}/thumb?v=${Date.now()}" alt="">` : `<div class="ph">✎</div>`) + `<div class="nm">${t.name}</div>`;
      d.onclick = () => { S.theme = t; S.who = null; S.g = {}; $('crumb1').textContent = t.name; renderWho(); show('s-who'); };
      box.appendChild(d);
    }
  }
  function variantKey() {
    if (S.who === '1') return S.g.a ? `1-${S.g.a}` : null;
    if (S.who === '2') return (S.g.a && S.g.b) ? `2-${S.g.a}-${S.g.b}` : null;
    if (S.who === 'pet') return S.g.a ? `pet-${S.g.a}` : null;
    return null;
  }
  function renderWho() {
    document.querySelectorAll('#who .choice').forEach(c => { c.classList.toggle('on', c.dataset.w === S.who); c.onclick = () => { S.who = c.dataset.w; S.g = {}; renderWho(); }; });
    const g = $('genders'); g.innerHTML = '';
    const pair = (key, title) => {
      const d = document.createElement('div'); d.className = 'pair'; d.innerHTML = `<h3>${title}</h3><div class="choices"></div>`;
      for (const v of ['male', 'female']) { const c = document.createElement('div'); c.className = 'choice' + (S.g[key] === v ? ' on' : ''); c.textContent = LABEL[v]; c.onclick = () => { S.g[key] = v; renderWho(); }; d.querySelector('.choices').appendChild(c); }
      g.appendChild(d);
    };
    if (S.who === '1') pair('a', 'This person is');
    if (S.who === '2') { pair('a', 'Person on the LEFT (as you see it on screen)'); pair('b', 'Person on the RIGHT'); }
    if (S.who === 'pet') pair('a', 'The person is');
    const k = variantKey(); const ok = k && S.theme.variants.includes(k);
    $('nextWho').disabled = !ok;
    if (k && !ok) { const w = document.createElement('p'); w.className = 'err'; w.textContent = 'That combination isn\'t available for this style yet.'; g.appendChild(w); }
  }
  $('backWho').onclick = () => show('s-theme');
  $('nextWho').onclick = () => { $('crumb2').textContent = `${S.theme.name} · ${variantLabel()}`; openCam(); show('s-cam'); };
  function variantLabel() { const k = variantKey(); return ({ '1-male': 'one male', '1-female': 'one female', '2-male-male': 'two males', '2-female-female': 'two females', '2-male-female': 'male + female', '2-female-male': 'female + male', 'pet-male': 'male + pet', 'pet-female': 'female + pet' })[k] || k; }

  const COUNTDOWN = 3;
  async function openCam() {
    $('shot').style.display = 'none'; $('video').style.display = ''; $('guide').style.display = ''; $('shutter').style.display = ''; $('shutter').disabled = false; $('camTip').style.display = ''; $('count').className = 'count'; $('camBar').style.display = ''; $('shotBar').style.display = 'none'; S.blob = null;
    if (streamAlive()) { $('video').srcObject = S.stream; return; } S.stream = null;
    // 4:3 at the front camera's native framing; the <video> is shown cover-cropped so the face fills the screen
    const portrait = window.innerHeight > window.innerWidth; S.camPortrait = portrait;
    // ask the front camera for the orientation we're in, so the feed fills the screen instead of being letterboxed
    const tries = portrait
      ? [{ video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 1280 }, aspectRatio: { ideal: 3 / 4 } }, audio: false }, { video: { facingMode: 'user' }, audio: false }, { video: true, audio: false }]
      : [{ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 }, aspectRatio: { ideal: 4 / 3 } }, audio: false }, { video: { facingMode: 'user' }, audio: false }, { video: true, audio: false }];
    for (const c of tries) { try { S.stream = await navigator.mediaDevices.getUserMedia(c); break; } catch (e) { S.camErr = e; } }
    if (S.stream) { $('video').srcObject = S.stream; $('camTip').textContent = 'Get your face in the oval, then tap the button'; }
    else { $('shutter').style.display = 'none'; $('guide').style.display = 'none'; $('camTip').textContent = 'Camera not available — use "Use a photo instead"'; }
  }
  // The camera stays on while a guest is posing/reviewing, and is released on the status screen so the
  // green camera light goes off and the battery isn't drained between guests. iPadOS remembers the
  // permission answer for a site (and for a home-screen app), so the next guest's tap re-opens it with no prompt.
  function closeCam() { if (S.stream) { S.stream.getTracks().forEach(t => t.stop()); S.stream = null; $('video').srcObject = null; } }
  window.addEventListener('pagehide', () => { if (S.stream) S.stream.getTracks().forEach(t => t.stop()); });
  // if the OS suspends the track (iPad sleep), reopen it next time the camera screen shows
  function streamAlive() { return S.stream && S.stream.getTracks().some(t => t.readyState === 'live'); }
  // if the iPad is rotated, re-request the camera in the new orientation (permission is already granted, so no prompt)
  window.addEventListener('resize', () => { const portrait = window.innerHeight > window.innerWidth; if (S.stream && portrait !== S.camPortrait && !S.counting) { S.stream.getTracks().forEach(t => t.stop()); S.stream = null; if ($('s-cam').classList.contains('on') && $('video').style.display !== 'none') openCam(); } });
  function capture() {
    const v = $('video'); const c = document.createElement('canvas');
    // crop the captured frame to what the guest saw on screen (object-fit: cover)
    const box = $('cam').getBoundingClientRect(); const vw = v.videoWidth, vh = v.videoHeight; const zoom = S.zoom || 1; const scale = Math.max(box.width / vw, box.height / vh) * zoom;
    const cw = Math.round(box.width / scale), ch = Math.round(box.height / scale); const sx = Math.round((vw - cw) / 2), sy = Math.round((vh - ch) / 2);
    c.width = cw; c.height = ch; const g2 = c.getContext('2d');
    g2.translate(cw, 0); g2.scale(-1, 1); g2.drawImage(v, sx, sy, cw, ch, 0, 0, cw, ch); // un-mirror so left/right match the guest's choice
    const fl = document.createElement('div'); fl.className = 'flash on'; $('cam').appendChild(fl); setTimeout(() => fl.remove(), 400);
    c.toBlob(b => { S.blob = b; showShot(URL.createObjectURL(b)); }, 'image/jpeg', 0.92);
  }
  $('shutter').onclick = () => {
    if (S.counting) return; S.counting = true; $('shutter').disabled = true; $('camTip').style.display = 'none';
    const el = $('count'); el.className = 'count on'; let n = COUNTDOWN; el.textContent = n;
    const t = setInterval(() => { n--; if (n > 0) { el.textContent = n; return; } clearInterval(t); el.textContent = 'SMILE!'; el.classList.add('go'); setTimeout(() => { el.className = 'count'; S.counting = false; capture(); }, 350); }, 1000);
  };
  $('fileBtn').onclick = () => $('fileIn').click();
  $('fileIn').onchange = () => { const f = $('fileIn').files[0]; if (f) { S.blob = f; showShot(URL.createObjectURL(f)); } $('fileIn').value = ''; };
  function showShot(url) { $('shot').src = url; $('shot').style.display = ''; $('video').style.display = 'none'; $('guide').style.display = 'none'; $('shutter').style.display = 'none'; $('camTip').style.display = 'none'; $('camBar').style.display = 'none'; $('shotBar').style.display = ''; }
  $('retake').onclick = openCam;
  $('backCam').onclick = () => { closeCam(); show('s-who'); };
  const _origShow = show; // keep idle timer in sync with screen changes
  $('send').onclick = async () => {
    $('send').disabled = true; $('send').textContent = 'Sending…';
    const fd = new FormData(); fd.append('photo', S.blob, 'photo.jpg'); fd.append('theme', S.theme.slug); fd.append('variant', variantKey());
    try {
      const r = await fetch('/api/jobs', { method: 'POST', body: fd }); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
      S.job = j; S.cdTimer = null; S.cdText = ''; closeCam(); show('s-status'); poll();
    } catch (e) { alert('Could not send: ' + e.message); }
    $('send').disabled = false; $('send').textContent = 'Looks good — send it';
  };
  async function poll() {
    const st = $('status'); const j = S.job;
    const r = await fetch('/api/jobs/' + j.id).then(r => r.json()).catch(() => null); if (!r) return setTimeout(poll, 3000);
    S.job = r;
    if (r.status === 'pending' || r.status === 'processing') { st.innerHTML = `<div class="spin"></div><h1>Drawing your sketch…</h1><p class="sub">You're <b>#${r.position || '?'}</b> in line. This takes about a minute.</p>`; S.pollTimer = setTimeout(poll, 2500); return; }
    if (r.status === 'failed') { st.innerHTML = `<div class="err">Sorry — that one didn't work. Please try again.<br><small>${r.error || ''}</small></div><p class="sub" id="cd"></p>`; startCountdown(15); return; }
    st.innerHTML = `<img class="art" src="/api/jobs/${r.id}/art?v=${Date.now()}"><h1>You're #${r.number}</h1><p class="sub">${r.status === 'done' ? 'Drawn! Pick it up at the robot.' : r.status === 'drawing' ? 'The robot is drawing you right now!' : 'Watch the robot — your sketch is <b>#' + (r.position || '?') + '</b> in line.'}</p><p class="sub" id="cd"></p>`;
    if (!S.cdTimer) startCountdown(RESET_AFTER_ART); else { const el = $('cd'); if (el) el.textContent = S.cdText || ''; }
    if (r.status !== 'done') S.pollTimer = setTimeout(poll, 4000);
  }
  const RESET_AFTER_ART = 20, IDLE_RESET = 90; // seconds
  function goHome() { clearTimeout(S.pollTimer); clearInterval(S.cdTimer); S.cdTimer = null; S.cdText = ''; closeCam(); S.theme = null; S.job = null; S.who = null; S.g = {}; loadThemes(); show('s-theme'); }
  function startCountdown(secs) {
    clearInterval(S.cdTimer); let left = secs; const tick = () => { S.cdText = `Next person in ${left} s — tap to stay`; const el = $('cd'); if (el) el.textContent = S.cdText; if (left-- <= 0) goHome(); };
    tick(); S.cdTimer = setInterval(tick, 1000);
    const stay = () => { clearInterval(S.cdTimer); S.cdTimer = 'stay'; S.cdText = 'Tap "Next person" when you\'re done.'; const el = $('cd'); if (el) el.textContent = S.cdText; }; $('status').onclick = stay;
  }
  // idle reset on the middle screens (someone tapped a style then wandered off)
  let idle = null; const bump = () => { clearTimeout(idle); if (!$('s-theme').classList.contains('on') && !$('s-status').classList.contains('on')) idle = setTimeout(goHome, IDLE_RESET * 1000); };
  for (const ev of ['touchstart', 'mousedown', 'keydown']) window.addEventListener(ev, bump, { passive: true });
  $('again').onclick = goHome;
  loadThemes(); setInterval(() => { if ($('s-theme').classList.contains('on')) loadThemes(); }, 30000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
