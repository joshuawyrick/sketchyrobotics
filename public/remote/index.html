<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Get drawn by a robot</title>
<style>
  :root{--blue:#006df6;--ink:#0a0a0a;--mut:#5b6474;--bg:#f3f5f8;--card:#fff;--line:#dde2ea}
  *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:520px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:24px;margin:0}.crumb{color:var(--mut);font-size:14px}.hint{color:var(--mut)}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:2px solid var(--line);border-radius:16px;padding:18px;font:700 19px system-ui;background:var(--card);color:var(--ink);cursor:pointer;text-align:center}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{opacity:.5}.btn.sm{padding:12px;font-size:16px}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{border:2px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;cursor:pointer;text-align:center}.tile img,.tile .ph{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#fff}.tile .ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}.tile .n{padding:8px;font-weight:700;font-size:15px}.tile.on{border-color:var(--blue);outline:2px solid var(--blue)}
  .opts{display:flex;flex-direction:column;gap:8px}.opt{border:2px solid var(--line);border-radius:12px;padding:14px;background:#fff;font-weight:700;cursor:pointer}.opt.on{border-color:var(--blue);background:#eaf2ff}
  .preview{width:100%;border-radius:16px;background:#fff;border:2px solid var(--line);max-height:60vh;object-fit:contain;display:block}
  .msg{padding:14px 16px;border-radius:14px;background:#fff;border:2px solid var(--line)}.bad{border-color:#d7263d;background:#fdeaed}
  .big{font-size:40px;font-weight:900;text-align:center;margin:10px 0 0}.sub{text-align:center;color:var(--mut)}.price{font:900 30px system-ui;color:var(--blue);text-align:center}
  .art{width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;display:block}
  .spin{width:42px;height:42px;border:5px solid #dde2ea;border-top-color:var(--blue);border-radius:50%;animation:r 1s linear infinite;margin:10px auto}@keyframes r{to{transform:rotate(360deg)}}
  .bot{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:4px 12px;font:800 15px system-ui}
  .steps{display:flex;gap:6px;justify-content:center}.steps i{width:28px;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--blue)}
  a.lnk{color:var(--mut);text-align:center;display:block;margin-top:6px}
</style>
</head>
<body>
<main>
  <div class="crumb" id="crumb">Sketchy Robotics</div>
  <div class="steps" id="steps"><i></i><i></i><i></i><i></i></div>
  <div id="scr"></div>
  <div id="err" class="msg bad" style="display:none"></div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id); const scr = $('scr');
  const code = location.pathname.split('/').filter(Boolean).pop(); const Q = new URLSearchParams(location.search);
  const S = { info: null, theme: null, variant: null, file: null, job: null, poll: null };
  const KEY = 'sketchy.remote.job.' + code;
  const fail = m => { $('err').textContent = m; $('err').style.display = ''; }; const okErr = () => $('err').style.display = 'none';
  const step = n => $('steps').querySelectorAll('i').forEach((i, k) => i.classList.toggle('on', k < n));
  const money = c => '$' + (c / 100).toFixed(2).replace(/\.00$/, '');
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

  async function load() {
    try { const r = await fetch('/api/remote/' + code); S.info = await r.json(); if (!r.ok || !S.info.ok) throw new Error('off'); }
    catch (_) { scr.innerHTML = ''; return fail('This link is not active right now. Ask the Sketchy Robotics crew for a fresh one.'); }
    $('crumb').textContent = S.info.event || 'Sketchy Robotics';
    const jid = Q.get('job') || localStorage.getItem(KEY); if (jid) { S.job = { id: jid }; return status(); }
    themes();
  }
  function themes() { step(1); okErr();
    scr.innerHTML = `<h1>Get drawn by a robot</h1><p class="hint">Pick a style. Your photo is turned into line art and a robot arm draws it at the event.</p><div class="tiles">${S.info.themes.map(t => `<div class="tile" data-slug="${t.slug}">${t.hasThumb ? `<img src="/api/remote/${code}/thumb/${t.slug}">` : '<div class="ph">no preview</div>'}<div class="n">${esc(t.name)}</div></div>`).join('') || '<p class="hint">No styles are open right now.</p>'}</div>`;
    scr.querySelectorAll('.tile').forEach(d => d.onclick = () => { S.theme = S.info.themes.find(t => t.slug === d.dataset.slug); who(); }); }
  function who() { step(2);
    scr.innerHTML = `<h1>${esc(S.theme.name)}</h1><p class="hint">Who's in the photo?</p><div class="opts">${S.theme.variants.map(v => `<div class="opt" data-v="${v}">${esc(S.info.variants[v])}</div>`).join('')}</div><a class="lnk" href="#" id="back">← styles</a>`;
    scr.querySelectorAll('.opt').forEach(o => o.onclick = () => { S.variant = o.dataset.v; photo(); }); $('back').onclick = e => { e.preventDefault(); themes(); }; }
  function photo() { step(3);
    scr.innerHTML = `<h1>Your photo</h1><p class="hint">Face the camera, good light, nothing covering the face${S.variant.startsWith('2') ? ' — both of you in one photo, in the order you chose' : ''}.</p>
      <button class="btn primary" id="take">📷 Take a photo</button><div style="height:10px"></div><button class="btn" id="choose">🖼️ Choose from my phone</button>
      <input type="file" id="takeIn" accept="image/*" capture="user" style="display:none"><input type="file" id="chooseIn" accept="image/*" style="display:none"><a class="lnk" href="#" id="back">← who's in it</a>`;
    $('take').onclick = () => $('takeIn').click(); $('choose').onclick = () => $('chooseIn').click(); $('back').onclick = e => { e.preventDefault(); who(); };
    const picked = inp => { const f = inp.files[0]; inp.value = ''; if (!f) return; S.file = f; confirm(); }; $('takeIn').onchange = () => picked($('takeIn')); $('chooseIn').onchange = () => picked($('chooseIn')); }
  function confirm() { step(3);
    scr.innerHTML = `<img class="preview" id="pv"><div style="height:10px"></div><button class="btn primary" id="send">Send it to the robot</button><div style="height:8px"></div><button class="btn sm" id="again">Pick a different photo</button>`;
    $('pv').src = URL.createObjectURL(S.file); $('again').onclick = photo;
    $('send').onclick = async () => { $('send').disabled = true; $('send').textContent = 'Sending…'; okErr();
      const fd = new FormData(); fd.append('photo', S.file, 'photo.jpg'); fd.append('theme', S.theme.slug); fd.append('variant', S.variant);
      try { const r = await fetch(`/api/remote/${code}/jobs`, { method: 'POST', body: fd }); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'upload failed'); S.job = d; localStorage.setItem(KEY, d.id); status(); }
      catch (e) { fail(e.message); $('send').disabled = false; $('send').textContent = 'Send it to the robot'; } }; }

  async function status() { step(4); clearTimeout(S.poll);
    let r; try { const q = await fetch('/api/jobs/' + S.job.id); if (q.status === 404) { localStorage.removeItem(KEY); S.job = null; return themes(); } r = await q.json(); } catch (_) { S.poll = setTimeout(status, 4000); return; }
    S.job = r; const bot = r.bot ? `<span class="bot">ROBOT ${r.bot}</span>` : '';
    if (r.status === 'unpaid') { pay(r); return; }
    if (r.status === 'expired') { localStorage.removeItem(KEY); scr.innerHTML = `<div class="msg bad">That one timed out before it was paid.</div><button class="btn primary" id="restart">Start again</button>`; $('restart').onclick = themes; return; }
    if (r.status === 'failed') { scr.innerHTML = `<div class="msg bad">We couldn't make a sketch from that photo — ${esc(r.error || 'please try another one')}.</div><button class="btn primary" id="restart">Try another photo</button>`; $('restart').onclick = () => { localStorage.removeItem(KEY); photo(); }; return; }
    if (r.status === 'pending' || r.status === 'processing') { scr.innerHTML = `<div class="spin"></div><h1 style="text-align:center">Making your sketch…</h1><p class="sub">You're <b>#${r.number}</b>. This takes about a minute — keep this page open or come back later.</p>`; }
    else if (r.status === 'ready' || r.status === 'drawing' || r.status === 'queued') { scr.innerHTML = `<img class="art" src="/api/jobs/${r.id}/art?v=${r.readyAt || 0}"><div class="big">#${r.number}</div><p class="sub">${r.status === 'drawing' ? 'The robot is drawing yours right now ✍️' : (r.position > 0 ? `${r.position} ahead of you in the robot queue` : 'Next up for the robot')} ${bot}</p><p class="sub">Head to the booth to pick it up. Press and hold the picture to save it.</p>`; }
    else if (r.status === 'done') { localStorage.removeItem(KEY); scr.innerHTML = `<img class="art" src="/api/jobs/${r.id}/art?v=${r.doneAt || 0}"><div class="big">Drawn! ✓</div><p class="sub">#${r.number} is finished ${bot} — collect it at the booth. Press and hold the picture to save it.</p><button class="btn sm" id="another">Send another photo</button>`; $('another').onclick = () => { S.job = null; themes(); }; return; }
    else { scr.innerHTML = `<div class="spin"></div><p class="sub">${esc(r.status)}</p>`; }
    S.poll = setTimeout(status, 3000);
  }
  function pay(r) { const sizes = (S.info.pay && S.info.pay.sizes) || [];
    if (!r.pay || !r.pay.size) { if (sizes.length === 1) return choose(sizes[0].id);
      scr.innerHTML = `<h1>Pick your size</h1><div class="opts">${sizes.map(z => `<div class="opt" data-size="${z.id}">${esc(z.label)} <span style="float:right;color:var(--blue)">${z.text}</span></div>`).join('')}</div>`; scr.querySelectorAll('[data-size]').forEach(o => o.onclick = () => choose(o.dataset.size)); return; }
    scr.innerHTML = `<h1 style="text-align:center">Pay to start</h1><div class="price">${money(r.pay.amount)} · ${esc(r.pay.label)}</div><p class="sub">Apple Pay, Google Pay or any card. The robot starts the moment it goes through.</p><a class="btn primary" href="${S.payUrl || '#'}" id="payBtn">Pay ${money(r.pay.amount)}</a>${sizes.length > 1 ? '<a class="lnk" href="#" id="resize">change size</a>' : ''}${Q.get('paid') ? '<p class="sub">Checking your payment…</p>' : ''}`;
    if (!S.payUrl) choose(r.pay.size, true); const rs = $('resize'); if (rs) rs.onclick = e => { e.preventDefault(); S.payUrl = null; r.pay = null; pay(r); };
    S.poll = setTimeout(status, 3000);
    async function choose(id, quiet) { if (!quiet) scr.innerHTML = '<div class="spin"></div>'; try { const q = await fetch('/api/jobs/' + S.job.id + '/pay', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ size: id }) }); const d = await q.json(); if (!q.ok) throw new Error(d.error || q.status); S.payUrl = d.url; S.job.pay = { size: d.size, label: d.label, amount: d.amount }; const b = $('payBtn'); if (b) b.href = d.url; else pay(S.job); } catch (e) { fail('Payment is not available right now: ' + e.message); } } }
  load();
})();
</script>
</body>
</html>
